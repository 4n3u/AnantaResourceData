name: monitor

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll client build metadata
        run: python main.py
      - name: Commit on change
        run: |
          git config user.name "ananta-monitor"
          git config user.email "ananta-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "build snapshot $(date -u +%Y%m%d-%H%M)"
            git push
          fi
